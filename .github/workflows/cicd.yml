name: CI/CD

on:
  pull_request:
    branches: [ "develop" ]
  push:
    branches: [ "develop" ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

  docker-build-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/buddys-server:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/buddys-server:latest

  cd:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat << 'EOF' > .env
          ${{ secrets.ENV }}
          EOF

      - name: Prepare EC2 Docker Directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/BUDDYS-SERVER/docker

      - name: Copy .env
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".env"
          target: "/home/ubuntu/BUDDYS-SERVER/docker/"

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker/docker-compose.yml"
          target: "/home/ubuntu/BUDDYS-SERVER/docker/"
          strip_components: 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/BUDDYS-SERVER/docker

            if [ ! -f ".env" ]; then
              echo "❌ .env 파일이 없습니다."
              exit 1
            fi

            echo "최신 Docker 이미지 pull"
            sudo docker compose --env-file .env pull

            echo "기존 systemd jar 서비스 중지"
            sudo systemctl stop buddys || true
            sudo systemctl disable buddys || true

            echo "기존 Docker 컨테이너 정리"
            sudo docker compose --env-file .env down --remove-orphans

            echo "Docker 컨테이너 실행"
            sudo docker compose --env-file .env up -d

            echo "불필요한 dangling image 정리"
            sudo docker image prune -f

            echo "실행 중인 컨테이너 확인"
            sudo docker ps

            sleep 15

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080 || echo "000")

            if [ "$STATUS" = "000" ] || [ "$STATUS" -ge 500 ]; then
              echo "❌ 애플리케이션 응답 확인 실패. HTTP status: $STATUS"
              sudo docker logs buddys-server-app
              exit 1
            fi

            echo "✅ 배포 완료. HTTP status: $STATUS"
