name: CI/CD

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

  docker-build-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Docker Hub Login
        uses: docker/login-action@v3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$DOCKER_USERNAME/buddys-server:latest" \
            -t "$DOCKER_USERNAME/buddys-server:$IMAGE_TAG" \
            .

      - name: Push Docker Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$DOCKER_USERNAME/buddys-server:latest"
          docker push "$DOCKER_USERNAME/buddys-server:$IMAGE_TAG"

  cd:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create .env file
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          printf '%s\n' "$ENV_FILE_CONTENT" > .env
          sed -i '/^DOCKER_IMAGE=/d' .env
          printf 'DOCKER_IMAGE=%s/buddys-server:%s\n' "$DOCKER_USERNAME" "$IMAGE_TAG" >> .env

      - name: Prepare EC2 Docker Directory
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/BUDDYS-SERVER/docker

      - name: Copy .env
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".env"
          target: "/home/ubuntu/BUDDYS-SERVER/docker/"

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker/docker-compose.yml"
          target: "/home/ubuntu/BUDDYS-SERVER/docker/"
          strip_components: 1

      - name: Copy blue-green deploy script
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker/deploy-blue-green.sh"
          target: "/home/ubuntu/BUDDYS-SERVER/docker/"
          strip_components: 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DISCORD_WEBHOOK_URL,DOCKER_USERNAME,IMAGE_TAG
          script: |
            cd /home/ubuntu/BUDDYS-SERVER/docker

            notify_discord() {
              if [ -n "$DISCORD_WEBHOOK_URL" ]; then
                curl -sS -H "Content-Type: application/json" \
                  -d "{\"content\":\"$1\"}" \
                  "$DISCORD_WEBHOOK_URL" >/dev/null || true
              fi
            }

            if [ ! -f ".env" ]; then
              echo ".env file is missing."
              notify_discord "BUDDYS-SERVER blue-green deploy failed: .env file is missing. commit=$IMAGE_TAG"
              exit 1
            fi

            chmod +x ./deploy-blue-green.sh

            DOCKER_IMAGE="$DOCKER_USERNAME/buddys-server:$IMAGE_TAG"
            echo "Starting blue-green deploy: image=$DOCKER_IMAGE"

            if ./deploy-blue-green.sh "$DOCKER_IMAGE"; then
              notify_discord "BUDDYS-SERVER blue-green deploy succeeded. image=$DOCKER_IMAGE commit=$IMAGE_TAG"
            else
              notify_discord "BUDDYS-SERVER blue-green deploy failed. image=$DOCKER_IMAGE commit=$IMAGE_TAG"
              exit 1
            fi
