name: CI/CD

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

  docker-build-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Docker Hub Login
        uses: docker/login-action@v3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$DOCKER_USERNAME/buddys-server:latest" \
            -t "$DOCKER_USERNAME/buddys-server:$IMAGE_TAG" \
            .

      - name: Push Docker Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$DOCKER_USERNAME/buddys-server:latest"
          docker push "$DOCKER_USERNAME/buddys-server:$IMAGE_TAG"

  cd:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create .env file
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          printf '%s\n' "$ENV_FILE_CONTENT" > .env
          sed -i '/^DOCKER_IMAGE=/d' .env
          printf 'DOCKER_IMAGE=%s/buddys-server:%s\n' "$DOCKER_USERNAME" "$IMAGE_TAG" >> .env

      - name: Prepare EC2 Docker Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/BUDDYS-SERVER/docker

      - name: Copy .env
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".env"
          target: "/home/ubuntu/BUDDYS-SERVER/docker/"

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker/docker-compose.yml"
          target: "/home/ubuntu/BUDDYS-SERVER/docker/"
          strip_components: 1

      - name: Copy Prometheus config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker/prometheus/prometheus.yml"
          target: "/home/ubuntu/BUDDYS-SERVER/docker/"
          strip_components: 1

      - name: Copy Grafana provisioning
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker/grafana/provisioning"
          target: "/home/ubuntu/BUDDYS-SERVER/docker/"
          strip_components: 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DISCORD_WEBHOOK_URL,IMAGE_TAG
          script: |
            cd /home/ubuntu/BUDDYS-SERVER/docker

            notify_discord() {
              if [ -n "$DISCORD_WEBHOOK_URL" ]; then
                curl -sS -H "Content-Type: application/json" \
                  -d "{\"content\":\"$1\"}" \
                  "$DISCORD_WEBHOOK_URL" >/dev/null || true
              fi
            }

            if [ ! -f ".env" ]; then
              echo "❌ .env 파일이 없습니다."
              notify_discord "❌ BUDDYS-SERVER 배포 실패: EC2에 .env 파일이 없습니다. commit=$IMAGE_TAG"
              exit 1
            fi

            PREVIOUS_IMAGE=$(sudo docker inspect buddys-server-app --format='{{.Config.Image}}' 2>/dev/null || true)
            PREVIOUS_IMAGE_ID=$(sudo docker inspect buddys-server-app --format='{{.Image}}' 2>/dev/null || true)
            ROLLBACK_IMAGE="${PREVIOUS_IMAGE_ID:-$PREVIOUS_IMAGE}"

            echo "최신 Docker 이미지 pull"
            sudo docker compose --env-file .env pull

            echo "기존 systemd jar 서비스 중지"
            sudo systemctl stop buddys || true
            sudo systemctl disable buddys || true

            echo "기존 Docker 컨테이너 정리"
            sudo docker compose --env-file .env down --remove-orphans

            echo "Docker 컨테이너 실행"
            sudo docker compose --env-file .env up -d

            echo "실행 중인 컨테이너 확인"
            sudo docker ps

            HEALTH_URL="http://127.0.0.1:8080/actuator/health"
            STATUS="000"

            for attempt in $(seq 1 30); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL") || STATUS="000"
              if [ "$STATUS" = "200" ]; then
                break
              fi
              echo "애플리케이션 준비 대기 중... attempt=$attempt status=$STATUS"
              sleep 5
            done

            if [ "$STATUS" != "200" ]; then
              echo "❌ 애플리케이션 응답 확인 실패. HTTP status: $STATUS"
              sudo docker logs buddys-server-app || true
              if [ -n "$ROLLBACK_IMAGE" ]; then
                echo "직전 Docker 이미지로 롤백합니다: $ROLLBACK_IMAGE"
                notify_discord "❌ BUDDYS-SERVER 배포 헬스체크 실패. 직전 이미지로 롤백을 시작합니다. status=$STATUS commit=$IMAGE_TAG"
                sudo docker compose --env-file .env down --remove-orphans
                sed -i.bak '/^DOCKER_IMAGE=/d' .env
                printf 'DOCKER_IMAGE=%s\n' "$ROLLBACK_IMAGE" >> .env
                sudo docker compose --env-file .env up -d

                ROLLBACK_STATUS="000"
                for attempt in $(seq 1 30); do
                  ROLLBACK_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL") || ROLLBACK_STATUS="000"
                  if [ "$ROLLBACK_STATUS" = "200" ]; then
                    echo "✅ 롤백 완료. HTTP status: $ROLLBACK_STATUS"
                    notify_discord "✅ BUDDYS-SERVER 롤백 완료. rollback_status=$ROLLBACK_STATUS failed_commit=$IMAGE_TAG"
                    exit 1
                  fi
                  echo "롤백 애플리케이션 준비 대기 중... attempt=$attempt status=$ROLLBACK_STATUS"
                  sleep 5
                done

                echo "❌ 롤백 후에도 애플리케이션 응답 확인 실패. HTTP status: $ROLLBACK_STATUS"
                sudo docker logs buddys-server-app || true
                notify_discord "🚨 BUDDYS-SERVER 롤백 실패. rollback_status=$ROLLBACK_STATUS failed_commit=$IMAGE_TAG"
              else
                echo "롤백할 직전 Docker 이미지가 없습니다."
                notify_discord "🚨 BUDDYS-SERVER 배포 실패. 롤백할 직전 Docker 이미지가 없습니다. status=$STATUS commit=$IMAGE_TAG"
              fi
              exit 1
            fi

            echo "✅ 배포 완료. HTTP status: $STATUS"
            notify_discord "✅ BUDDYS-SERVER 배포 완료. status=$STATUS commit=$IMAGE_TAG"

            echo "불필요한 dangling image 정리"
            sudo docker image prune -f
