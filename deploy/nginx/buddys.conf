server {
    server_name buddys.xn--h32bi4v.xn--3e0b707e; //도메인 변경 후 수정!!!

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl; # managed by Certbot # 도메인 변경 후 수정!!!
    ssl_certificate /etc/letsencrypt/live/buddys.xn--h32bi4v.xn--3e0b707e/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/buddys.xn--h32bi4v.xn--3e0b707e/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = buddys.xn--h32bi4v.xn--3e0b707e) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name buddys.xn--h32bi4v.xn--3e0b707e;
    return 404; # managed by Certbot