spring:
  application:
    name: buddys

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: 3600000 # 1 hour
      refresh-token-expiration: 604800000 # 7 days

  oauth:
    kakao:
      client-id: ${KAKAO_REST_API_KEY}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-urls: ${KAKAO_REDIRECT_URLS}
      token-url: https://kauth.kakao.com/oauth/token
      user-info-url: https://kapi.kakao.com/v2/user/me
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-urls: ${GOOGLE_REDIRECT_URLS}
      token-url: https://oauth2.googleapis.com/token
      user-info-url: https://www.googleapis.com/oauth2/v3/userinfo

google:
  places:
    api-key: ${GOOGLE_PLACES_API_KEY}
    search-text-url: https://places.googleapis.com/v1/places:searchText
    search-nearby-url: https://places.googleapis.com/v1/places:searchNearby
    base-url: https://places.googleapis.com/v1

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_S3_REGION}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never
