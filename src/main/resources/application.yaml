spring:
  application:
    name: buddys

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      repositories:
        enabled: false

  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: 1800000 # 30 minutes
      refresh-token-expiration: 604800000 # 7 days

  oauth:
    kakao:
      client-id: ${KAKAO_REST_API_KEY}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-urls: ${KAKAO_REDIRECT_URLS}
      token-url: https://kauth.kakao.com/oauth/token
      user-info-url: https://kapi.kakao.com/v2/user/me
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-urls: ${GOOGLE_REDIRECT_URLS}
      token-url: https://oauth2.googleapis.com/token
      user-info-url: https://www.googleapis.com/oauth2/v3/userinfo

google:
  places:
    api-key: ${GOOGLE_PLACES_API_KEY}
    search-text-url: https://places.googleapis.com/v1/places:searchText
    search-nearby-url: https://places.googleapis.com/v1/places:searchNearby
    base-url: https://places.googleapis.com/v1

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_S3_REGION}
    ses:
      region: ${AWS_SES_REGION:ap-northeast-2}

mail:
  sender: ${MAIL_SENDER:no-reply@buddys.co.kr}

verification:
  university-email:
    code-expiration: 15m

buddys:
  redis:
    mode: ${REDIS_MODE:standalone}
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    username: ${REDIS_USERNAME:}
    password: ${REDIS_PASSWORD:}
    ssl-enabled: ${REDIS_SSL_ENABLED:false}
    connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}
    command-timeout: ${REDIS_COMMAND_TIMEOUT:3s}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never
