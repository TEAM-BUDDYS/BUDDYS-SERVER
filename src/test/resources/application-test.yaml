spring:
  data:
    redis:
      repositories:
        enabled: false

  security:
    jwt:
      secret: test-secret-key-for-testing-purposes-minimum-32-chars
      access-token-expiration: 3600000
      refresh-token-expiration: 604800000

  oauth:
    kakao:
      client-id: test-client-id
      client-secret: test-client-secret
      redirect-urls: http://localhost:8080/test,http://localhost:3000/test
      token-url: https://kauth.kakao.com/oauth/token
      user-info-url: https://kapi.kakao.com/v2/user/me
    google:
      client-id: test-client-id
      client-secret: test-client-secret
      redirect-urls: http://localhost:8080/test,http://localhost:3000/test
      token-url: https://oauth2.googleapis.com/token
      user-info-url: https://www.googleapis.com/oauth2/v3/userinfo

google:
  places:
    api-key: test-google-places-api-key
    search-text-url: https://places.googleapis.com/v1/places:searchText
    search-nearby-url: https://places.googleapis.com/v1/places:searchNearby
    base-url: https://places.googleapis.com/v1

cloud:
  aws:
    s3:
      bucket: buddys-test-bucket
      region: ap-northeast-2
    ses:
      region: ap-northeast-2

mail:
  sender: no-reply@buddys.co.kr

verification:
  university-email:
    token-expiration: 900000
    confirm-url: http://localhost:8080/api/v1/verifications/university/email/confirm

buddys:
  redis:
    mode: standalone
    host: localhost
    port: 6379
    ssl-enabled: false
    connect-timeout: 3s
    command-timeout: 3s
